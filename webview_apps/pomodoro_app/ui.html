<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Djazair Pomodoro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Vazirmatn:wght@300;400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Vazirmatn', sans-serif;
            background: radial-gradient(circle at center, #1e1e2f 0%, #0f0f16 100%);
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        .container {
            display: flex;
            width: 710px;
            height: 590px;
            background: rgba(30, 30, 46, 0.65);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* Right Panel (Timer Section) */
        .timer-panel {
            flex: 1.1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Left Panel (History / Tasks Section) */
        .sidebar-panel {
            flex: 0.9;
            padding: 30px;
            background: rgba(20, 20, 30, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .app-title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        /* Tabs Selection */
        .tabs {
            display: flex;
            background: rgba(15, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
        }

        /* Circular Timer Ring */
        .timer-container {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .timer-svg {
            transform: rotate(-90deg);
        }

        .ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.03);
            stroke-width: 8px;
        }

        .ring-progress {
            fill: none;
            stroke: url(#timerGradient);
            stroke-width: 8px;
            stroke-linecap: round;
            stroke-dasharray: 691;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.1s linear;
        }

        .timer-display {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-text {
            font-size: 48px;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            letter-spacing: -1px;
            line-height: 1;
        }

        .status-text {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #a78bfa;
            margin-top: 5px;
            font-weight: 600;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            flex: 1.5;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex: 1;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        /* Sidebar Section (Task & History) */
        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
            display: block;
            font-weight: 600;
        }

        .task-input {
            width: 100%;
            background: rgba(15, 15, 25, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .task-input:focus {
            border-color: #8b5cf6;
        }

        /* History List */
        .history-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .history-title {
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-left: 4px; /* for scrollbar spacing */
        }

        /* Custom scrollbar */
        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item-details {
            display: flex;
            flex-direction: column;
        }

        .history-item-task {
            font-size: 13px;
            font-weight: 600;
            color: #f1f5f9;
        }

        .history-item-meta {
            font-size: 11px;
            color: #64748b;
            margin-top: 3px;
        }

        .badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 700;
        }

        .badge.work { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .badge.break { background: rgba(34, 197, 94, 0.15); color: #22c55e; }

        .footer {
            font-size: 11px;
            color: #475569;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar Panel (Left) -->
        <div class="sidebar-panel">
            <div>
                <div class="app-title">🍅 رفيق الإنتاجية</div>
                
                <div class="input-group">
                    <label class="input-label">المهمة الحالية</label>
                    <input type="text" id="taskInput" class="task-input" placeholder="ما الذي تعمل عليه الآن؟" value="برمجة بلغة جزائر">
                </div>
            </div>

            <div class="history-section">
                <div class="history-title">
                    <span>السجل الأخير</span>
                    <span id="sessionCounter" style="color: #8b5cf6;">0 جلسات</span>
                </div>
                <div class="history-list" id="historyList">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <div class="footer">
                Djazair Desktop Webview Application
            </div>
        </div>

        <!-- Timer Panel (Right) -->
        <div class="timer-panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('work', 25)">جلسة عمل</button>
                <button class="tab-btn" onclick="switchTab('short_break', 5)">راحة قصيرة</button>
                <button class="tab-btn" onclick="switchTab('long_break', 15)">راحة طويلة</button>
            </div>

            <div class="timer-container">
                <svg class="timer-svg" width="230" height="230">
                    <defs>
                        <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#a78bfa" />
                            <stop offset="100%" stop-color="#6366f1" />
                        </linearGradient>
                    </defs>
                    <circle class="ring-bg" cx="115" cy="115" r="110" />
                    <circle class="ring-progress" id="progressRing" cx="115" cy="115" r="110" />
                </svg>
                <div class="timer-display">
                    <div class="time-text" id="timeText">25:00</div>
                    <div class="status-text" id="statusText">أدرس / اعمل</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" onclick="resetTimer()">إعادة</button>
                <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">ابدأ</button>
            </div>
        </div>
    </div>

    <script>
        let duration = 25 * 60; // default 25 minutes
        let timeRemaining = duration;
        let timerInterval = null;
        let activeTab = 'work';
        let isRunning = false;

        const timeText = document.getElementById('timeText');
        const startBtn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const progressRing = document.getElementById('progressRing');
        const taskInput = document.getElementById('taskInput');
        const historyList = document.getElementById('historyList');
        const sessionCounter = document.getElementById('sessionCounter');

        // Play chime using Web Audio API
        function playChime() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                // First note
                let osc1 = ctx.createOscillator();
                let gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                gain1.gain.setValueAtTime(0.3, ctx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start();
                osc1.stop(ctx.currentTime + 0.8);

                // Second note slightly delayed
                let osc2 = ctx.createOscillator();
                let gain2 = ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(659.25, ctx.currentTime + 0.25); // E5
                gain2.gain.setValueAtTime(0, ctx.currentTime);
                gain2.gain.setValueAtTime(0.3, ctx.currentTime + 0.25);
                gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.0);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.start(ctx.currentTime + 0.25);
                osc2.stop(ctx.currentTime + 1.0);
            } catch (e) {
                console.error(e);
            }
        }

        // Circular progress ring updates
        // Radius of circle = 110, circumference = 2 * PI * r = ~691
        const circumference = 2 * Math.PI * 110;
        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            progressRing.style.strokeDashoffset = offset;
        }

        function updateDisplay() {
            const mins = Math.floor(timeRemaining / 60);
            const secs = timeRemaining % 60;
            timeText.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            const percent = (timeRemaining / duration) * 100;
            setProgress(percent);
        }

        function switchTab(type, minutes) {
            if (isRunning) {
                toggleTimer();
            }
            activeTab = type;
            duration = minutes * 60;
            timeRemaining = duration;
            
            // UI tab updates
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            let btnIndex = type === 'work' ? 0 : (type === 'short_break' ? 1 : 2);
            document.querySelectorAll('.tab-btn')[btnIndex].classList.add('active');

            if (type === 'work') {
                statusText.textContent = 'أدرس / اعمل';
                statusText.style.color = '#a78bfa';
            } else {
                statusText.textContent = 'استرخِ قليلاً';
                statusText.style.color = '#10b981';
            }

            updateDisplay();
        }

        function toggleTimer() {
            if (isRunning) {
                // Pause
                clearInterval(timerInterval);
                startBtn.textContent = 'ابدأ';
                startBtn.style.background = 'linear-gradient(135deg, #8b5cf6, #6366f1)';
                isRunning = false;
            } else {
                // Start
                timerInterval = setInterval(() => {
                    if (timeRemaining > 0) {
                        timeRemaining--;
                        updateDisplay();
                    } else {
                        onTimerComplete();
                    }
                }, 1000);
                startBtn.textContent = 'مؤقت';
                startBtn.style.background = '#ef4444';
                isRunning = true;
            }
        }

        function resetTimer() {
            if (isRunning) {
                toggleTimer();
            }
            timeRemaining = duration;
            updateDisplay();
        }

        function onTimerComplete() {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.textContent = 'ابدأ';
            startBtn.style.background = 'linear-gradient(135deg, #8b5cf6, #6366f1)';
            playChime();

            let task = taskInput.value || 'بدون عنوان';
            let label = activeTab === 'work' ? 'جلسة عمل كاملة' : 'فترة استراحة';

            // Send notification to Backend
            window.djazair.invoke('notify', ['تمت الجلسة! 🍅', `${label}: ${task}`]);

            // Save session to Backend DB
            window.djazair.invoke('saveSession', [task, activeTab, duration, 1]).then(() => {
                loadHistory();
            });

            resetTimer();
        }

        function loadHistory() {
            window.djazair.invoke('getHistory', []).then(function(sessions) {
                historyList.innerHTML = '';
                sessionCounter.textContent = `${sessions.length} جلسات`;
                
                sessions.forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    
                    let badgeClass = s.session_type === 'work' ? 'work' : 'break';
                    let badgeLabel = s.session_type === 'work' ? 'عمل' : 'راحة';
                    let mins = Math.floor(s.duration / 60);

                    div.innerHTML = `
                        <div class="history-item-details">
                            <div class="history-item-task">${s.task_name}</div>
                            <div class="history-item-meta">${s.created_at} &middot; ${mins} دقيقة</div>
                        </div>
                        <span class="badge ${badgeClass}">${badgeLabel}</span>
                    `;
                    historyList.appendChild(div);
                });
            });
        }

        // Initialize display
        updateDisplay();

        // Wait for webview interface to bridge, then load history
        setTimeout(() => {
            if (window.djazair) {
                loadHistory();
            }
        }, 300);
    </script>
</body>
</html>
