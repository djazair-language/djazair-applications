<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Upload</title>
<script src="https://cdn.tailwindcss.com">
</script>
<script>
tailwind.config={theme:{extend:{colors:{primary:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'}}}}}
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:linear-gradient(135deg,#f0f4ff 0,#e8f0fe 100%);min-height:100vh}
.drop-zone{border:2px dashed #93c5fd;border-radius:1rem;background:#fff;transition:all .3s ease;cursor:pointer}
.drop-zone:hover,.drop-zone.dragover{border-color:#3b82f6;background:#eff6ff;transform:translateY(-2px);box-shadow:0 8px 25px rgba(59,130,246,.15)}
.drop-zone.dragover{background:#dbeafe;border-color:#2563eb}
.file-card{transition:all .3s ease;border:1px solid #e5e7eb}
.file-card:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.08);border-color:#93c5fd}
.file-card .actions{opacity:0;transition:opacity .25s ease}
.file-card:hover .actions{opacity:1}
.preview-img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.progress-bar{height:4px;background:#e5e7eb;border-radius:2px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:2px;transition:width .4s ease}
.toast{position:fixed;bottom:24px;right:24px;z-index:1000;transform:translateY(100px);opacity:0;transition:all .4s ease}
.toast.show{transform:translateY(0);opacity:1}
.toast-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.toast-success{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal-content{background:#fff;border-radius:1rem;padding:2rem;max-width:500px;width:90%;box-shadow:0 25px 50px rgba(0,0,0,.2);animation:modalIn .3s ease}
@keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.empty-state{text-align:center;padding:4rem 2rem;color:#9ca3af}
.empty-state i{font-size:4rem;margin-bottom:1rem}
.skeleton{background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<div class="max-w-5xl mx-auto px-4 py-8">
  <div class="text-center mb-10">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-primary-100 rounded-2xl mb-4">
      <i class="fas fa-cloud-upload-alt text-3xl text-primary-600"></i>
    </div>
    <h1 class="text-3xl font-bold text-gray-800 mb-2">File Upload</h1>
    <p class="text-gray-500">Drag & drop files here or click to upload. Max 1 GB per file.</p>
  </div>

  <div class="drop-zone p-8 mb-8 text-center" id="dropZone">
    <i class="fas fa-cloud-upload-alt text-5xl text-primary-400 mb-4"></i>
    <p class="text-lg font-medium text-gray-700 mb-2">Drag & drop files here</p>
    <p class="text-gray-400 mb-4">or</p>
    <button onclick="document.getElementById('fileInput').click()" class="bg-primary-600 text-white px-6 py-3 rounded-xl font-medium hover:bg-primary-700 transition shadow-md hover:shadow-lg">
      <i class="fas fa-folder-open mr-2"></i>Choose Files
    </button>
    <input type="file" id="fileInput" class="hidden" multiple>
    <div id="uploadProgress" class="mt-4 hidden">
      <div class="progress-bar"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
      <p class="text-sm text-gray-500 mt-2" id="progressText">Uploading...</p>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between flex-wrap gap-2">
      <h2 class="text-lg font-bold text-gray-800"><i class="fas fa-files mr-2 text-primary-500"></i>Uploaded Files</h2>
      <div class="flex items-center gap-2">
        <span class="text-sm text-gray-400 mr-2" id="fileCount">0 files</span>
        <span class="text-xs text-gray-300">|</span>
        <span class="text-xs text-gray-500 mr-1">Sort:</span>
        <button onclick="changeSort('date')" data-sort="date" class="sort-btn text-xs px-2 py-1 rounded bg-primary-500 text-white font-medium">Date</button>
        <button onclick="changeSort('name')" data-sort="name" class="sort-btn text-xs px-2 py-1 rounded bg-gray-100 text-gray-700 hover:bg-gray-200">Name</button>
        <button onclick="changeSort('size')" data-sort="size" class="sort-btn text-xs px-2 py-1 rounded bg-gray-100 text-gray-700 hover:bg-gray-200">Size</button>
      </div>
    </div>
    <div id="filesContainer" class="p-6">
      <div class="empty-state">
        <i class="fas fa-inbox"></i>
        <p class="text-lg font-medium">No files yet</p>
        <p class="text-sm">Upload your first file using the area above</p>
      </div>
    </div>
    <div id="pagination" class="px-6 pb-6"></div>
  </div>
</div>

<div class="modal-overlay" id="deleteModal">
  <div class="modal-content">
    <div class="text-center">
      <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-trash-alt text-2xl text-red-500"></i>
      </div>
      <h3 class="text-xl font-bold text-gray-800 mb-2">Confirm Delete</h3>
      <p class="text-gray-500 mb-6" id="deleteMsg">Are you sure you want to delete this file?</p>
      <div class="flex gap-3 justify-center">
        <button onclick="closeDeleteModal()" class="px-6 py-2.5 border border-gray-200 rounded-xl text-gray-600 hover:bg-gray-50 transition font-medium">Cancel</button>
        <button id="confirmDelete" class="px-6 py-2.5 bg-red-600 text-white rounded-xl hover:bg-red-700 transition font-medium shadow-sm">
          <i class="fas fa-trash-alt mr-2"></i>Delete
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
const API = window.location.origin;
let currentPage = 1;
let currentSort = 'date';
let totalFiles = 0;
const PAGE_SIZE = 50;

function showToast(msg, type) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast rounded-xl px-6 py-3 shadow-lg flex items-center gap-3 ' + (type === 'error' ? 'toast-error' : 'toast-success');
  t.innerHTML = '<i class="fas fa-' + (type === 'error' ? 'exclamation-circle' : 'check-circle') + '"></i><span>' + msg + '</span>';
  c.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 500) }, 3000);
}

function closeDeleteModal() {
  document.getElementById('deleteModal').classList.remove('open');
  deleteTarget = null;
}

function confirmDelete(safeName, fileName) {
  deleteTarget = safeName;
  document.getElementById('deleteMsg').textContent = 'Are you sure you want to delete "' + fileName + '"?';
  document.getElementById('deleteModal').classList.add('open');
}

document.getElementById('confirmDelete').onclick = function() {
  if (!deleteTarget) return;
  const btn = this;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Deleting...';
  fetch(API + '/api/files/' + encodeURIComponent(deleteTarget), { method: 'DELETE' })
    .then(r => r.json())
    .then(() => { showToast('File deleted successfully', 'success'); loadFiles(); closeDeleteModal() })
    .catch(() => showToast('Failed to delete file', 'error'))
    .finally(() => { btn.disabled = false; btn.innerHTML = '<i class="fas fa-trash-alt mr-2"></i>Delete' });
};

document.querySelectorAll('[data-delete]').forEach(el => {
  el.addEventListener('click', function() {
    confirmDelete(this.dataset.safe, this.dataset.name);
  });
});

function formatDate(d) {
  if (!d) return '—';
  if (typeof d === 'number') {
    const date = new Date(d * 1000);
    return date.toLocaleString('en-US');
  }
  const p = d.split('T');
  if (p.length < 2) return d;
  return p[0] + ' ' + p[1].split('.')[0];
}

function getIcon(type, name) {
  if (type.startsWith('image/')) return 'fa-file-image text-green-500';
  if (type.startsWith('video/')) return 'fa-file-video text-purple-500';
  if (type.startsWith('audio/')) return 'fa-file-audio text-yellow-500';
  if (type.startsWith('text/')) return 'fa-file-alt text-blue-500';
  if (name.endsWith('.pdf')) return 'fa-file-pdf text-red-500';
  if (type.includes('zip') || type.includes('rar') || type.includes('tar') || type.includes('7z') || type.includes('gzip'))
    return 'fa-file-archive text-orange-500';
  if (type.includes('spreadsheet') || type.includes('excel') || name.endsWith('.xls') || name.endsWith('.xlsx'))
    return 'fa-file-excel text-emerald-600';
  if (type.includes('document') || type.includes('word') || name.endsWith('.doc') || name.endsWith('.docx'))
    return 'fa-file-word text-blue-600';
  return 'fa-file text-gray-400';
}

function getPreviewHtml(file) {
  if (file.type.startsWith('image/'))
    return '<img src="' + API + '/u/' + encodeURIComponent(file.safeName) + '" alt="" class="preview-img" loading="lazy">';
  return '<i class="fas ' + getIcon(file.type, file.name) + ' text-3xl"></i>';
}

function pluralize(count) {
  if (count === 0) return 'No files';
  if (count === 1) return '1 file';
  return count + ' files';
}

function loadFiles() {
  const c = document.getElementById('filesContainer');
  c.innerHTML = '';
  for (let i = 0; i < 4; i++)
    c.innerHTML += '<div class="flex items-center gap-4 p-4 border-b border-gray-50"><div class="skeleton" style="width:48px;height:48px"></div><div class="flex-1"><div class="skeleton" style="width:60%;height:14px;margin-bottom:8px"></div><div class="skeleton" style="width:30%;height:12px"></div></div></div>';
  fetch(API + '/api/files?page=' + currentPage + '&limit=' + PAGE_SIZE + '&sort=' + currentSort)
    .then(r => r.json())
    .then(data => {
      const files = data.items;
      totalFiles = data.total;
      document.getElementById('fileCount').textContent = pluralize(totalFiles);
      c.innerHTML = '';
      if (!files.length) {
        c.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p class="text-lg font-medium">No files yet</p><p class="text-sm">Upload your first file using the area above</p></div>';
        updatePagination();
        return;
      }
      files.forEach(f => {
        const card = document.createElement('div');
        card.className = 'file-card rounded-xl p-4 flex items-center gap-4 bg-white mb-3';
        const safeSafe = encodeURIComponent(f.safeName);
        const safeNameAttr = f.safeName.replace(/'/g, "\\'");
        const safeFileName = f.name.replace(/'/g, "\\'");
        card.innerHTML = '<div class="flex-shrink-0">' + getPreviewHtml(f) + '</div>' +
          '<div class="flex-1 min-w-0"><p class="font-medium text-gray-800 truncate" title="' + f.name + '">' + f.name + '</p>' +
          '<p class="text-sm text-gray-400"><span>' + f.sizeFormatted + '</span><span class="mx-2">·</span><span>' + formatDate(f.uploadedAt) + '</span></p></div>' +
          '<div class="actions flex items-center gap-2"><a href="' + API + '/u/' + safeSafe + '" target="_blank" class="w-9 h-9 flex items-center justify-center rounded-lg text-gray-400 hover:text-primary-600 hover:bg-primary-50 transition" title="Preview"><i class="fas fa-eye"></i></a>' +
          '<a href="' + API + '/d/' + safeSafe + '" class="w-9 h-9 flex items-center justify-center rounded-lg text-gray-400 hover:text-green-600 hover:bg-green-50 transition" title="Download"><i class="fas fa-download"></i></a>' +
          '<button data-delete data-safe="' + safeNameAttr + '" data-name="' + safeFileName + '" class="w-9 h-9 flex items-center justify-center rounded-lg text-gray-400 hover:text-red-600 hover:bg-red-50 transition" title="Delete"><i class="fas fa-trash-alt"></i></button></div>';
        c.appendChild(card);
      });
      updatePagination();
      document.querySelectorAll('[data-delete]').forEach(el => {
        el.addEventListener('click', function() {
          confirmDelete(this.dataset.safe, this.dataset.name);
        });
      });
    })
    .catch(() => {
      c.innerHTML = '<div class="text-center py-8 text-red-500"><i class="fas fa-exclamation-triangle text-4xl mb-3"></i><p class="font-medium">Failed to load files</p><p class="text-sm mt-2">Make sure the server is running</p></div>';
    });
}

function updatePagination() {
  const el = document.getElementById('pagination');
  const totalPages = Math.ceil(totalFiles / PAGE_SIZE) || 1;
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  let html = '<div class="flex items-center justify-center gap-2 mt-6">';
  html += '<button onclick="goPage(' + (currentPage - 1) + ')" class="px-4 py-2 rounded-lg border ' + (currentPage <= 1 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-gray-50') + '" ' + (currentPage <= 1 ? 'disabled' : '') + '><i class="fas fa-chevron-left"></i></button>';
  for (let p = 1; p <= totalPages; p++) {
    if (p === currentPage) {
      html += '<span class="px-4 py-2 rounded-lg bg-primary-500 text-white font-medium">' + p + '</span>';
    } else if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 2) {
      html += '<button onclick="goPage(' + p + ')" class="px-4 py-2 rounded-lg border hover:bg-gray-50">' + p + '</button>';
    } else if (Math.abs(p - currentPage) === 3) {
      html += '<span class="px-2 text-gray-400">...</span>';
    }
  }
  html += '<button onclick="goPage(' + (currentPage + 1) + ')" class="px-4 py-2 rounded-lg border ' + (currentPage >= totalPages ? 'opacity-40 cursor-not-allowed' : 'hover:bg-gray-50') + '" ' + (currentPage >= totalPages ? 'disabled' : '') + '><i class="fas fa-chevron-right"></i></button>';
  html += '</div>';
  el.innerHTML = html;
}

function goPage(p) {
  const totalPages = Math.ceil(totalFiles / PAGE_SIZE) || 1;
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  loadFiles();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function changeSort(sort) {
  currentSort = sort;
  currentPage = 1;
  loadFiles();
  document.querySelectorAll('.sort-btn').forEach(b => {
    b.classList.toggle('bg-primary-500', b.dataset.sort === sort);
    b.classList.toggle('text-white', b.dataset.sort === sort);
    b.classList.toggle('bg-gray-100', b.dataset.sort !== sort);
    b.classList.toggle('text-gray-700', b.dataset.sort !== sort);
  });
}

function uploadFile(file) {
  const p = document.getElementById('uploadProgress');
  const pf = document.getElementById('progressFill');
  const pt = document.getElementById('progressText');
  p.classList.remove('hidden');
  pf.style.width = '0%';
  pt.textContent = file.name;

  const formData = new FormData();
  formData.append('file', file);

  const xhr = new XMLHttpRequest();
  xhr.open('POST', API + '/api/upload');

  xhr.upload.onprogress = function(e) {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 100);
      pf.style.width = pct + '%';
      pt.textContent = file.name + ' (' + pct + '%)';
    }
  };

  xhr.onload = function() {
    if (xhr.status >= 200 && xhr.status < 300) {
      pf.style.width = '100%';
      pt.textContent = file.name + ' ✓';
      showToast('"' + file.name + '" uploaded successfully', 'success');
      loadFiles();
      setTimeout(() => { p.classList.add('hidden'); pf.style.width = '0%' }, 1000);
    } else {
      let msg = 'Upload error';
      try { const e = JSON.parse(xhr.responseText); msg = e.error || msg; } catch(_) {}
      pt.textContent = msg;
      showToast('Failed to upload "' + file.name + '"', 'error');
      setTimeout(() => p.classList.add('hidden'), 3000);
    }
  };

  xhr.onerror = function() {
    pt.textContent = 'Connection failed';
    showToast('Failed to upload "' + file.name + '"', 'error');
    setTimeout(() => p.classList.add('hidden'), 3000);
  };

  xhr.send(formData);
}

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover') });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  Array.from(e.dataTransfer.files).forEach(f => uploadFile(f));
});
fileInput.addEventListener('change', () => {
  Array.from(fileInput.files).forEach(f => uploadFile(f));
  fileInput.value = '';
});

window.addEventListener('keydown', e => { if (e.key === 'Escape') closeDeleteModal() });
document.getElementById('deleteModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeDeleteModal() });

loadFiles();
</script>
</body>
</html>
